<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Super CRM + Diary + Notes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <style>
    :root{
      --bg:#0b1020; --panel:#121a35; --panel2:#0f1530; --text:#eaf0ff; --muted:#aab4d6;
      --border:#1f2a4f; --accent:#5b8cff; --accent2:#74d680; --warn:#ffcc66; --danger:#ff6b6b;
      --header-height:60px;
    }
    [data-theme="light"]{
      --bg:#f5f7ff; --panel:#ffffff; --panel2:#f3f6ff; --text:#0c1533; --muted:#4a5577;
      --border:#d8def0; --accent:#375dfb; --accent2:#2fbf71; --warn:#f6b84e; --danger:#ef4b4b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    
    body{
      margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; 
      background:var(--bg); color:var(--text); 
      height:100dvh; width:100vw; overflow:hidden; 
      display:flex; flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }
    
    header{
      height:var(--header-height); flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
      background:var(--panel); border-bottom:1px solid var(--border); z-index:50;
      padding-top: env(safe-area-inset-top);
    }
    .search-bar{flex:1; position:relative}
    .search-bar input{
      width:100%; padding:10px 12px; padding-left:36px; border-radius:12px; border:1px solid var(--border); 
      background:var(--bg); color:var(--text); outline:none; font-size:16px;
    }
    .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.6}
    
    .icon-btn{
      background:transparent; border:none; color:var(--text); font-size:24px; cursor:pointer; 
      padding:8px; display:flex; align-items:center; justify-content:center;
    }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 140;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    aside.sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px; max-width: 80%;
      background: var(--panel); border-right: 1px solid var(--border);
      z-index: 150;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: calc(var(--header-height) + env(safe-area-inset-top));
      display: flex; flex-direction: column;
    }
    aside.sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 20px;
      font-size: 20px; font-weight: 800; color: var(--accent);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .sidebar-nav { padding: 10px; overflow-y: auto; flex: 1; }
    
    .nav-row {
      display: flex; align-items: center; gap: 15px;
      width: 100%; padding: 16px;
      background: transparent; border: none;
      color: var(--muted); font-size: 16px; font-weight: 600;
      text-align: left; cursor: pointer;
      border-radius: 8px; margin-bottom: 4px;
      transition: background 0.2s;
    }
    .nav-row:hover { background: var(--panel2); color: var(--text); }
    .nav-row.active { background: rgba(91,140,255,0.1); color: var(--accent); border-left: 4px solid var(--accent); }
    .nav-row span { font-size: 22px; width: 30px; text-align: center; }

    main{
      flex:1; overflow-y:auto; padding:16px; 
      padding-bottom: 100px;
      -webkit-overflow-scrolling: touch;
      position: relative; z-index: 10;
    }
    .container{max-width:800px; margin:0 auto}

    .fab{
      position:fixed; 
      bottom: calc(20px + env(safe-area-inset-bottom)); 
      right:20px;
      width:60px; height:60px; border-radius:50%; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:32px; 
      box-shadow:0 4px 15px rgba(0,0,0,.4); cursor:pointer; z-index:90; border:none;
    }
    .fab:active{transform:scale(0.95)}

    .hidden{display:none !important}
    .card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px}
    .inline{display:flex; gap:10px; align-items:center}
    .grow{flex:1}
    .muted{color:var(--muted); font-size:13px}
    
    .btn{padding:10px 16px; border-radius:10px; border:none; font-weight:600; cursor:pointer; font-size:14px; font-family:inherit}
    .btn.primary{background:var(--accent); color:#fff}
    .btn.secondary{background:var(--panel); border:1px solid var(--border); color:var(--text)}
    .btn.danger{background:var(--danger); color:#fff}
    .btn.sm{padding:6px 12px; font-size:12px}
    .btn.icon{padding:8px; border-radius:50% }
    .btn:active{transform:scale(0.97)}

    input, textarea, select{
      font-family:inherit;font-size:14px;
    }
    input[type="text"],input[type="tel"],input[type="date"],input[type="time"],textarea,select{
      width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
      background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;
    }
    input:focus,textarea:focus,select:focus{border-color:var(--accent)}

    label{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:6px; display:block}

    .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none}
    .chip{
      white-space:nowrap; padding:8px 14px; background:var(--panel); border:1px solid var(--border); 
      border-radius:99px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
    }
    .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}

    .row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start}
    .row:last-child{border-bottom:none}
    
    .pill{padding:3px 8px; border-radius:6px; font-size:11px; font-weight:800; text-transform:uppercase}
    .p-Pending{background:#20305f; color:#7fb1ff}
    .p-InProgress{background:#4a2b05; color:#ffb067}
    .p-Completed{background:#173726; color:#87e2a5}
    .p-due{background:#372a12; color:#ffd27e}
    .p-overdue{background:#3a1212; color:#ff9a9a}

    .hist-group-header{
      padding:12px; background:var(--panel); border-radius:10px; font-weight:700; font-size:14px;
      display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:8px;
    }
    .hist-content{display:none; padding-left:8px; margin-bottom:12px}
    .expanded .hist-content{display:block}
    
    .backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(3px); z-index:200;
      display:none; align-items:center; justify-content:center; padding:16px;
    }
    .modal{
      width:92%; max-width:500px; max-height:85dvh; background:var(--panel); border-radius:18px; 
      padding:0; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--border); display:flex; flex-direction:column;
    }
    .modal-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .modal-body{padding:16px;overflow-y:auto}
    .modal-foot{
      padding:12px 16px;
      border-top:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center;
      background:rgba(0,0,0,0.15);
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      gap:8px;
      flex-wrap:wrap;
    }

    #modalDiary .modal,
    #modalTask .modal,
    #modalLead .modal,
    #modalNote .modal,
    #modalVisit .modal {
      width: 95%; 
      max-width: 600px;
      height: 90dvh;
      max-height: 90dvh;
      display: flex;
    }

    #toaster{
      position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
      z-index:300;display:flex;flex-direction:column;gap:10px;width:90%;max-width:400px;
      pointer-events:none;
    }
    #toaster .toast-card{
      pointer-events:auto;
      background:var(--panel2);color:#fff;padding:12px 20px;
      border-radius:50px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.3);
      border:1px solid var(--accent);font-weight:600;
    }

    .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .settings-btn{
      display:flex; flex-direction:column; align-items:center; padding:18px; 
      background:var(--panel2); border-radius:12px; border:1px solid var(--border); cursor:pointer
    }
    .settings-btn span{font-size:26px; margin-bottom:8px}

    .date-header{
      position:sticky; top:72px; z-index:15;
      background:var(--bg); padding:8px 0; font-size:13px; font-weight:700; color:var(--muted);
      border-bottom:1px solid var(--border); margin:16px 0 8px 0; display:flex; align-items:center; gap:8px;
    }
    .date-header::after{content:'';flex:1;height:1px;background:var(--border)}
    
    .entry{
      position:relative; padding:14px; border-radius:8px; border:1px solid var(--border);
      background:rgba(30,41,59,0.5); margin-bottom:10px; cursor:pointer; transition:all .2s;
    }
    .entry:hover{background:var(--panel2);border-color:var(--accent)}
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sbMenu">
    <div class="sidebar-header">
      <span>🚀 App Menu</span>
      <button class="icon-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-nav">
      <button class="nav-row active" data-target="viewTasks"><span>📝</span> Tasks</button>
      <button class="nav-row" data-target="viewLeads"><span>👥</span> Leads</button>
      <button class="nav-row" data-target="viewVisits"><span>📍</span> Visits</button>
      <button class="nav-row" data-target="viewBot"><span>🤖</span> Bot Gen</button>
      <button class="nav-row" data-target="viewDiary"><span>📔</span> Diary</button>
      <button class="nav-row" data-target="viewNotes"><span>🗒️</span> Notes</button>
      <div class="hr"></div>
      <button class="nav-row" onclick="q('#modalSettings').style.display='flex'; toggleSidebar()"><span>⚙️</span> Settings</button>
    </div>
  </aside>

  <header>
    <button class="icon-btn" onclick="toggleSidebar()">☰</button>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Search everything..." />
    </div>
    <button class="icon-btn" id="btnMenu" title="Settings">⚙️</button>
  </header>

  <main>
    <div class="container">
      
      <div id="viewTasks">
        <div class="filters">
          <button class="chip active" data-filter="Pending">Pending</button>
          <button class="chip" data-filter="In Progress">In Progress</button>
          <button class="chip" data-filter="On Hold">On Hold</button>
          <button class="chip" data-filter="Completed">Completed</button>
        </div>
        <div id="taskList"></div>
      </div>

      <div id="viewLeads" class="hidden">
        <div class="filters">
          <button class="chip active" data-lfilter="All">All Leads</button>
          <button class="chip" data-lfilter="Interested">Interested</button>
          <button class="chip" data-lfilter="Converted">Converted</button>
        </div>
        <div id="leadList"></div>
      </div>

      <div id="viewVisits" class="hidden">
        <div class="inline wrap" style="justify-content:space-between; margin-bottom:10px">
          <h3 style="margin:0">Customer Visits</h3>
          <button class="btn primary sm" onclick="openVisitModal()">+ New Visit</button>
        </div>
        <div id="visitList"></div>
      </div>

      <div id="viewBot" class="hidden">
        <div class="inline" style="justify-content:space-between; margin-bottom:12px">
           <h3 style="margin:0">Timeline Queue</h3>
        </div>
        <div id="botHistoryList"></div>
      </div>

      <div id="viewDiary" class="hidden">
        <div class="inline wrap" style="justify-content:space-between; margin-bottom:10px">
          <h3 style="margin:0">Diary</h3>
          <button class="btn primary sm" onclick="CT.diary.openEntry()">+ New Entry</button>
        </div>
        <div id="diaryList"></div>
      </div>
      
      <div id="viewNotes" class="hidden">
        <div class="inline wrap" style="justify-content:space-between; margin-bottom:10px">
          <h3 style="margin:0">Notes</h3>
          <button class="btn primary sm" onclick="CT.notes.openNote()">+ New Note</button>
        </div>
        <div id="noteList"></div>
      </div>

    </div>
  </main>

  <button id="fab" class="fab">+</button>

  <div id="modalVisit" class="backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 style="margin:0">Log Customer Visit</h3>
        <button class="btn secondary sm" onclick="closeModals()">✕</button>
      </div>
      <div class="modal-body">
        <label>Customer Name</label>
        <input id="vName" type="text" placeholder="Enter Name">
        <div class="inline">
          <div class="grow">
            <label>Phone Number</label>
            <input id="vPhone" type="tel" placeholder="0000000000">
          </div>
          <div class="grow">
            <label>Customer ID (Optional)</label>
            <input id="vCustId" type="text" placeholder="ID-123">
          </div>
        </div>
        <div class="inline">
          <div class="grow">
            <label>Date</label>
            <input id="vDate" type="date">
          </div>
          <div class="grow">
            <label>Time</label>
            <input id="vTime" type="time">
          </div>
        </div>
        <label>GPS / Location Details (Paste from Map App)</label>
        <textarea id="vGps" placeholder="Paste coordinates or link here..." style="min-height:80px"></textarea>
      </div>
      <div class="modal-foot">
        <button id="btnDelVisit" class="btn danger sm hidden">Delete</button>
        <div class="inline">
          <button class="btn secondary sm" onclick="closeModals()">Cancel</button>
          <button id="btnSaveVisit" class="btn primary">Save Visit</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalTask" class="backdrop"><div class="modal">...Task Modal UI...</div></div>
  <div id="modalSettings" class="backdrop">
    <div class="modal">
      <div class="modal-head"><h3>Settings</h3><button class="btn secondary sm" onclick="closeModals()">✕</button></div>
      <div class="modal-body"><div class="settings-grid">
        <div class="settings-btn" id="btnTheme"><span>🌗</span>Theme</div>
        <div class="settings-btn" id="btnBackup"><span>💾</span>Backup</div>
      </div></div>
    </div>
  </div>

  <div id="modalDiary" class="backdrop">
    <div class="modal">
      <div class="modal-head"><h3 id="modalDiaryTitle">Entry</h3><button class="btn secondary sm" onclick="closeModals()">✕</button></div>
      <div class="modal-body">
        <input id="enDate" type="date">
        <input id="enTitle" type="text" placeholder="Title">
        <textarea id="enBody" placeholder="Note content..." style="min-height:200px"></textarea>
      </div>
      <div class="modal-foot"><button id="saveDiaryBtn" class="btn primary">Save</button></div>
    </div>
  </div>

  <script>
    const q = s => document.querySelector(s);
    const qAll = s => document.querySelectorAll(s);
    const uuid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
    const todayISO = () => new Date().toISOString().slice(0,10);
    const nowTime = () => new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});

    // State
    let tasks = JSON.parse(localStorage.getItem('ct_tasks') || '[]');
    let customers = JSON.parse(localStorage.getItem('ct_cust') || '[]');
    let leads = JSON.parse(localStorage.getItem('ct_leads') || '[]');
    let visits = JSON.parse(localStorage.getItem('ct_visits') || '[]'); // New
    let diary = JSON.parse(localStorage.getItem('ct_diary') || '[]');
    let notes = JSON.parse(localStorage.getItem('ct_notes') || '[]');
    let currentView = 'viewTasks';
    let editId = null;

    const save = () => {
      localStorage.setItem('ct_tasks', JSON.stringify(tasks));
      localStorage.setItem('ct_leads', JSON.stringify(leads));
      localStorage.setItem('ct_visits', JSON.stringify(visits));
      localStorage.setItem('ct_diary', JSON.stringify(diary));
      localStorage.setItem('ct_notes', JSON.stringify(notes));
      render();
    };

    const toast = (msg, type='info') => {
      const d = document.createElement('div'); d.className = 'toast-card';
      d.textContent = msg; q('#toaster').appendChild(d);
      setTimeout(()=>d.remove(), 2500);
    };

    window.toggleSidebar = () => {
      q('#sbMenu').classList.toggle('open');
      q('#sbOverlay').classList.toggle('open');
    };

    qAll('.nav-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        if(!target) return;
        qAll('.nav-row').forEach(r => r.classList.remove('active'));
        btn.classList.add('active');
        currentView = target;
        ['viewTasks','viewLeads','viewBot','viewDiary','viewNotes','viewVisits'].forEach(id => q('#'+id)?.classList.add('hidden'));
        q('#' + target).classList.remove('hidden');
        toggleSidebar();
        render();
      });
    });

    /* --- VISITS MODULE LOGIC --- */
    function openVisitModal(id = null) {
      editId = id;
      q('#vName').value = ''; q('#vPhone').value = ''; q('#vCustId').value = '';
      q('#vDate').value = todayISO(); q('#vTime').value = nowTime(); q('#vGps').value = '';
      q('#btnDelVisit').classList.add('hidden');

      if(id) {
        const v = visits.find(x => x.id === id);
        q('#vName').value = v.name; q('#vPhone').value = v.phone; q('#vCustId').value = v.custId;
        q('#vDate').value = v.date; q('#vTime').value = v.time; q('#vGps').value = v.gps;
        q('#btnDelVisit').classList.remove('hidden');
      }
      q('#modalVisit').style.display = 'flex';
    }

    q('#btnSaveVisit').onclick = () => {
      const data = {
        id: editId || uuid(),
        name: q('#vName').value,
        phone: q('#vPhone').value,
        custId: q('#vCustId').value,
        date: q('#vDate').value,
        time: q('#vTime').value,
        gps: q('#vGps').value
      };
      if(!data.name) return toast('Name required', 'error');
      
      if(editId) {
        const idx = visits.findIndex(x => x.id === editId);
        visits[idx] = data;
      } else {
        visits.push(data);
      }
      save(); q('#modalVisit').style.display = 'none'; toast('Visit Logged');
    };

    q('#btnDelVisit').onclick = () => {
      visits = visits.filter(x => x.id !== editId);
      save(); q('#modalVisit').style.display = 'none';
    };

    function renderVisits(term = '') {
      const list = q('#visitList'); list.innerHTML = '';
      const pool = visits.filter(v => v.name.toLowerCase().includes(term) || v.phone.includes(term));
      
      pool.sort((a,b) => b.date.localeCompare(a.date)).forEach(v => {
        const div = document.createElement('div');
        div.className = 'row entry';
        div.onclick = () => openVisitModal(v.id);
        div.innerHTML = `
          <div class="grow">
            <strong>${v.name}</strong> <span class="muted">(${v.phone})</span>
            <div class="muted small">${v.date} @ ${v.time} | ID: ${v.custId || 'N/A'}</div>
            <div style="font-size:11px; color:var(--accent); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${v.gps}</div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    /* --- GLOBAL RENDER --- */
    function render() {
      const term = q('#globalSearch').value.toLowerCase();
      if(currentView === 'viewVisits') renderVisits(term);
      // ... existing render functions for tasks, leads, etc.
    }

    q('#fab').onclick = () => {
        if(currentView === 'viewVisits') openVisitModal();
        // ... rest of fab logic
    };

    function closeModals() { qAll('.backdrop').forEach(b => b.style.display='none'); }

    // Initial Load
    render();
  </script>
  <div id="toaster"></div>
</body>
</html>
