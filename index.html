<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Super CRM & Bot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <style>
    :root{
      --bg:#0b1020; --panel:#121a35; --panel2:#0f1530; --text:#eaf0ff; --muted:#aab4d6;
      --border:#1f2a4f; --accent:#5b8cff; --accent2:#74d680; --warn:#ffcc66; --danger:#ff6b6b;
      --nav-height:60px; --header-height:60px;
    }
    [data-theme="light"]{
      --bg:#f5f7ff; --panel:#ffffff; --panel2:#f3f6ff; --text:#0c1533; --muted:#4a5577;
      --border:#d8def0; --accent:#375dfb; --accent2:#2fbf71; --warn:#f6b84e; --danger:#ef4b4b;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; display:flex; flex-direction:column;}
    
    /* --- HEADER --- */
    header{
      height:var(--header-height); flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
      background:var(--panel); border-bottom:1px solid var(--border); z-index:20;
    }
    .search-bar{
      flex:1; position:relative;
    }
    .search-bar input{
      width:100%; padding:8px 12px; padding-left:34px; border-radius:99px; border:1px solid var(--border); 
      background:var(--bg); color:var(--text); outline:none; font-size:14px;
    }
    .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5}
    
    .icon-btn{
      background:transparent; border:none; color:var(--text); font-size:20px; cursor:pointer; position:relative; padding:4px;
    }
    .badge{
      position:absolute; top:0; right:0; width:10px; height:10px; background:var(--danger); border-radius:50%; border:2px solid var(--panel); display:none;
    }
    .badge.show{display:block}

    /* --- MAIN CONTENT --- */
    main{
      flex:1; overflow-y:auto; padding:16px; padding-bottom:90px; /* Space for FAB/Nav */
      scroll-behavior: smooth;
    }
    .container{max-width:800px; margin:0 auto}

    /* --- BOTTOM NAV --- */
    .bottom-nav{
      height:var(--nav-height); flex-shrink:0; display:flex; justify-content:space-around; align-items:center;
      background:var(--panel); border-top:1px solid var(--border); z-index:20; padding-bottom:env(safe-area-inset-bottom);
    }
    .nav-item{
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      color:var(--muted); font-size:11px; font-weight:600; cursor:pointer; height:100%;
    }
    .nav-item.active{color:var(--accent)}
    .nav-icon{font-size:20px}

    /* --- FAB --- */
    .fab{
      position:fixed; bottom:calc(var(--nav-height) + 16px); right:16px;
      width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(0,0,0,.3);
      cursor:pointer; z-index:30; transition:transform .2s; border:none;
    }
    .fab:active{transform:scale(0.95)}

    /* --- COMMON UI --- */
    .hidden{display:none !important}
    .card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px}
    .inline{display:flex; gap:8px; align-items:center}
    .wrap{flex-wrap:wrap}
    .grow{flex:1}
    .right{margin-left:auto}
    .muted{color:var(--muted); font-size:12px}
    .hr{height:1px; background:var(--border); margin:12px 0}
    
    .btn{padding:8px 14px; border-radius:8px; border:none; font-weight:600; cursor:pointer; font-size:13px}
    .btn.primary{background:var(--accent); color:#fff}
    .btn.secondary{background:var(--panel); border:1px solid var(--border); color:var(--text)}
    .btn.danger{background:var(--danger); color:#fff}
    .btn.sm{padding:4px 10px; font-size:12px}

    /* Filters */
    .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; scrollbar-width:none}
    .chip{
      white-space:nowrap; padding:6px 12px; background:var(--panel); border:1px solid var(--border); 
      border-radius:99px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer;
    }
    .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}

    /* Lists */
    .row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); align-items:flex-start}
    .row:last-child{border-bottom:none}
    
    /* Pills */
    .pill{padding:2px 6px; border-radius:4px; font-size:10px; font-weight:800; text-transform:uppercase}
    .p-Pending{background:#20305f; color:#7fb1ff}
    .p-InProgress{background:#4a2b05; color:#ffb067}
    .p-Completed{background:#173726; color:#87e2a5}
    .p-due{background:#372a12; color:#ffd27e}
    .p-overdue{background:#3a1212; color:#ff9a9a}

    /* History / Accordion */
    .hist-group-header{
      padding:10px; background:var(--panel); border-radius:8px; font-weight:700; font-size:13px;
      display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:6px;
    }
    .hist-content{display:none; padding-left:8px; margin-bottom:12px}
    .expanded .hist-content{display:block}
    
    /* Modals */
    .backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px); z-index:100;
      display:none; align-items:center; justify-content:center;
    }
    .modal{
      width:90%; max-width:500px; max-height:85vh; background:var(--panel); border-radius:16px; 
      padding:20px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }
    
    /* Form Inputs */
    input, textarea, select{
      width:100%; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:8px;
      color:var(--text); outline:none; font-size:14px; display:block; margin-bottom:10px;
    }
    label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:4px; display:block}
    
    /* Action Grid for Settings */
    .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .settings-btn{
      display:flex; flex-direction:column; align-items:center; padding:15px; 
      background:var(--panel2); border-radius:10px; border:1px solid var(--border); cursor:pointer
    }
    .settings-btn span{font-size:24px; margin-bottom:6px}

    /* Bot Gen Grid */
    .time-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
  </style>
</head>
<body>

  <header>
    <div style="font-size:18px">🚀</div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Search everything..." />
    </div>
    <button class="icon-btn" id="btnDueSoon" title="Due Soon">
      🔔<div id="dueBadge" class="badge"></div>
    </button>
    <button class="icon-btn" id="btnMenu" title="Settings">⚙️</button>
  </header>

  <main>
    <div class="container">
      
      <div id="viewTasks">
        <div class="filters">
          <button class="chip active" data-filter="Pending">Pending</button>
          <button class="chip" data-filter="In Progress">In Progress</button>
          <button class="chip" data-filter="On Hold">On Hold</button>
          <button class="chip" data-filter="Completed">Completed</button>
        </div>
        <div id="taskList"></div>
      </div>

      <div id="viewLeads" class="hidden">
        <div class="filters">
          <button class="chip active" data-lfilter="All">All</button>
          <button class="chip" data-lfilter="Talked">Talked</button>
          <button class="chip" data-lfilter="Interested">Interested</button>
          <button class="chip" data-lfilter="Converted">Converted</button>
        </div>
        <div id="leadList"></div>
      </div>

      <div id="viewBot" class="hidden">
        <div class="inline" style="justify-content:space-between; margin-bottom:10px">
           <h3 style="margin:0">Timeline Queue</h3>
           <div class="muted">Pres → Fut</div>
        </div>
        <div id="botHistoryList"></div>
      </div>

    </div>
  </main>

  <button id="fab" class="fab">+</button>

  <nav class="bottom-nav">
    <div class="nav-item active" data-target="viewTasks">
      <span class="nav-icon">📝</span> Tasks
    </div>
    <div class="nav-item" data-target="viewLeads">
      <span class="nav-icon">👥</span> Leads
    </div>
    <div class="nav-item" data-target="viewBot">
      <span class="nav-icon">🤖</span> Bot Gen
    </div>
  </nav>

  <div id="modalSettings" class="backdrop">
    <div class="modal">
      <div class="inline" style="justify-content:space-between">
        <h3>Tools & Settings</h3>
        <button class="btn secondary sm" onclick="closeModals()">✕</button>
      </div>
      <div class="hr"></div>
      <div class="settings-grid">
        <div class="settings-btn" id="btnStats"><span>📊</span>Stats</div>
        <div class="settings-btn" id="btnTheme"><span>🌗</span>Theme</div>
        <div class="settings-btn" id="btnBackup"><span>💾</span>Backup</div>
        <div class="settings-btn" id="btnCSVs"><span>📤</span>Export CSV</div>
      </div>
      <div id="statsPanel" class="hidden card" style="margin-top:15px; text-align:center"></div>
    </div>
  </div>

  <div id="modalTask" class="backdrop">
    <div class="modal">
      <h3>Add/Edit Task</h3>
      <label>Customer Name</label>
      <input id="tName" type="text" placeholder="John Doe">
      <label>Mobile</label>
      <input id="tMobile" type="tel" placeholder="9876543210">
      <label>Description</label>
      <textarea id="tDesc" placeholder="Task details..."></textarea>
      <div class="inline">
        <div class="grow"><label>Due Date</label><input id="tDue" type="date"></div>
        <div class="grow">
            <label>Status</label>
            <select id="tStatus">
                <option>Pending</option><option>In Progress</option><option>On Hold</option>
                <option>Cancelled</option><option>Completed</option>
            </select>
        </div>
      </div>
      <div class="inline" style="margin-top:10px">
        <button id="btnSaveTask" class="btn primary grow">Save</button>
        <button id="btnDelTask" class="btn danger hidden">Delete</button>
      </div>
    </div>
  </div>

  <div id="modalLead" class="backdrop">
    <div class="modal">
      <h3>Add/Edit Lead</h3>
      <label>Name</label><input id="lName" type="text">
      <label>Mobile</label><input id="lMobile" type="tel">
      <label>Product</label><input id="lProd" type="text">
      <label>Status</label>
      <select id="lStatus">
        <option>Talked</option><option>Interested</option>
        <option>Waiting Confirmation</option><option>Converted</option>
      </select>
      <label>Notes</label><textarea id="lNotes"></textarea>
      <div class="inline" style="margin-top:10px">
        <button id="btnSaveLead" class="btn primary grow">Save</button>
        <button id="btnDelLead" class="btn danger hidden">Delete</button>
      </div>
    </div>
  </div>

  <div id="modalBot" class="backdrop">
    <div class="modal">
      <div class="inline" style="justify-content:space-between">
          <h3>New Command</h3>
          <button class="btn secondary sm" id="btnResetBot">Reset</button>
      </div>
      <div class="hr"></div>
      <div class="time-grid">
         <button class="btn secondary sm" onclick="CT.bot.smartTime(10,0)">10 AM</button>
         <button class="btn secondary sm" onclick="CT.bot.smartTime(11,0)">11 AM</button>
         <button class="btn secondary sm" onclick="CT.bot.smartTime(15,30)">3:30 PM</button>
         <button class="btn secondary sm" onclick="CT.bot.smartTime(16,0)">4 PM</button>
      </div>
      <div class="inline">
          <div class="grow"><label>Date</label><input id="bDate" type="date"></div>
          <div class="grow"><label>Time</label><input id="bTime" type="time"></div>
      </div>
      <div class="inline" style="margin-bottom:10px">
         <button class="btn secondary sm grow" onclick="CT.bot.addDays(1)">+1 Day</button>
         <button class="btn secondary sm grow" onclick="CT.bot.addDays(2)">+2 Days</button>
      </div>
      <label>Message</label>
      <input id="bMsg" type="text" placeholder="Reminder text...">
      
      <button id="btnGenBot" class="btn primary" style="width:100%; padding:12px; margin-top:10px">GENERATE & SAVE</button>
      
      <div id="botOutput" class="hidden" style="margin-top:15px; background:var(--bg); padding:10px; border-radius:8px; font-family:monospace; font-size:12px; word-break:break-all"></div>
    </div>
  </div>

  <div id="modalDue" class="backdrop">
      <div class="modal">
          <h3>Due Soon / Overdue</h3>
          <div id="dueList" style="max-height:300px; overflow-y:auto; margin-bottom:10px"></div>
          <button class="btn secondary" style="width:100%" onclick="closeModals()">Close</button>
      </div>
  </div>

  <div id="modalSmartDel" class="backdrop">
      <div class="modal" style="text-align:center">
          <h3>Delete Schedule?</h3>
          <p class="muted">For <span id="sdDate"></span></p>
          <div class="hr"></div>
          <button id="btnEmailDel" class="btn primary" style="width:100%; margin-bottom:8px">📧 Email then Delete</button>
          <button id="btnJustDel" class="btn danger" style="width:100%">🗑️ Just Delete</button>
      </div>
  </div>

  <div id="toaster" style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px"></div>

  <script>
    /* --- CORE SYSTEM --- */
    const CT = window.CT || {};
    const q = s => document.querySelector(s);
    const qAll = s => document.querySelectorAll(s);
    const uuid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
    const nowISO = () => new Date().toISOString();
    
    // State
    let tasks = JSON.parse(localStorage.getItem('ct_tasks') || '[]');
    let customers = JSON.parse(localStorage.getItem('ct_cust') || '[]');
    let leads = JSON.parse(localStorage.getItem('ct_leads') || '[]');
    let botHist = JSON.parse(localStorage.getItem('ct_bot') || '[]');
    let currentView = 'viewTasks';
    let taskFilter = 'Pending';
    let leadFilter = 'All';
    let editId = null;
    let delTargetDate = null; // for smart delete

    // Save
    const save = () => {
        localStorage.setItem('ct_tasks', JSON.stringify(tasks));
        localStorage.setItem('ct_cust', JSON.stringify(customers));
        localStorage.setItem('ct_leads', JSON.stringify(leads));
        localStorage.setItem('ct_bot', JSON.stringify(botHist));
        render();
    };

    // Toaster
    const toast = (msg, type='info') => {
        const d = document.createElement('div');
        d.className = 'card';
        d.style.background = type==='error'?'var(--danger)':'var(--panel2)';
        d.style.color = '#fff'; d.style.padding='8px 16px'; d.textContent = msg;
        q('#toaster').appendChild(d);
        setTimeout(()=>d.remove(), 2500);
    };

    /* --- NAVIGATION --- */
    qAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
            qAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            currentView = el.dataset.target;
            q('#viewTasks').classList.add('hidden');
            q('#viewLeads').classList.add('hidden');
            q('#viewBot').classList.add('hidden');
            q('#' + currentView).classList.remove('hidden');
            render();
            window.scrollTo(0,0);
        });
    });

    // FAB Logic
    q('#fab').addEventListener('click', () => {
        if(currentView === 'viewTasks') openTaskModal();
        else if(currentView === 'viewLeads') openLeadModal();
        else if(currentView === 'viewBot') openBotModal();
    });

    /* --- RENDERING --- */
    function render(){
        const term = q('#globalSearch').value.toLowerCase().trim();
        checkDue();

        if(currentView === 'viewTasks') renderTasks(term);
        else if(currentView === 'viewLeads') renderLeads(term);
        else if(currentView === 'viewBot') renderBotHist();
    }

    /* 1. TASKS RENDER (Unified Priority) */
    function renderTasks(term){
        const list = q('#taskList'); list.innerHTML = '';
        let pool = tasks.slice();

        if(term){
            // Search Mode: Show all matching, sorted by Rank
            const rank = { "Pending":1, "In Progress":2, "On Hold":3, "Cancelled":4, "Completed":5 };
            pool = pool.filter(t => {
               const c = customers.find(x=>x.id===t.custId);
               return ((c?.name||'') + (t.desc||'')).toLowerCase().includes(term);
            });
            pool.sort((a,b) => (rank[a.status]||9) - (rank[b.status]||9));
        } else {
            // Filter Mode
            pool = pool.filter(t => t.status === taskFilter);
            pool.sort((a,b) => new Date(b.updated||0) - new Date(a.updated||0));
        }

        if(!pool.length) return list.innerHTML = `<div class="muted" style="text-align:center; padding:20px">No tasks found.</div>`;

        pool.forEach(t => {
            const c = customers.find(x=>x.id===t.custId);
            const div = document.createElement('div'); div.className = 'row';
            div.innerHTML = `
               <div class="grow" onclick="openTaskModal('${t.id}')">
                  <div class="inline">
                     <strong>${c?.name||'Unknown'}</strong>
                     <span class="pill p-${t.status.replace(' ','')}">${t.status}</span>
                  </div>
                  <div class="muted">${t.desc || ''}</div>
                  ${t.due ? `<div class="muted" style="color:${isOverdue(t)?'var(--danger)':'var(--warn)'}">Due: ${t.due}</div>` : ''}
               </div>
               <button class="btn secondary sm" onclick="wa('${c?.mobile}','${c?.name}')">💬</button>
            `;
            list.appendChild(div);
        });
    }

    /* 2. LEADS RENDER */
    function renderLeads(term){
        const list = q('#leadList'); list.innerHTML = '';
        let pool = leads.slice();
        
        if(term){
             pool = pool.filter(l => (l.name+l.prod).toLowerCase().includes(term));
        } else if(leadFilter !== 'All'){
             pool = pool.filter(l => l.status === leadFilter);
        }

        if(!pool.length) return list.innerHTML = `<div class="muted" style="text-align:center; padding:20px">No leads found.</div>`;

        pool.forEach(l => {
            const div = document.createElement('div'); div.className = 'row';
            div.innerHTML = `
               <div class="grow" onclick="openLeadModal('${l.id}')">
                  <div class="inline"><strong>${l.name}</strong> <span class="pill" style="background:var(--panel); border:1px solid var(--border)">${l.status}</span></div>
                  <div class="muted">${l.prod}</div>
               </div>
               <button class="btn secondary sm" onclick="wa('${l.mobile}','${l.name}')">💬</button>
               ${l.status!=='Converted' ? `<button class="btn primary sm" onclick="convertLead('${l.id}')">⭐</button>` : ''}
            `;
            list.appendChild(div);
        });
    }

    /* 3. BOT GEN RENDER (Timeline) */
    function renderBotHist(){
        const list = q('#botHistoryList'); list.innerHTML = '';
        if(!botHist.length) return list.innerHTML = `<div class="muted" style="text-align:center; padding:20px">History empty.</div>`;

        // Group by Date
        const grouped = {};
        botHist.forEach(i => { if(!grouped[i.date]) grouped[i.date]=[]; grouped[i.date].push(i); });
        
        // Sort keys ASC (Present -> Future)
        Object.keys(grouped).sort().forEach(date => {
            const items = grouped[date];
            const div = document.createElement('div');
            div.innerHTML = `
              <div class="hist-group-header" onclick="this.parentElement.classList.toggle('expanded')">
                 <span>📅 ${date} <span class="muted">(${items.length})</span></span>
                 <div class="inline">
                    <button class="btn secondary sm" onclick="event.stopPropagation(); promptSmartDel('${date}')">🗑️</button>
                 </div>
              </div>
              <div class="hist-content">
                 ${items.map(i => `
                    <div class="row" style="padding:6px 0">
                       <div class="muted" style="font-family:monospace; min-width:50px">${i.time}</div>
                       <div class="grow muted">${i.msg}</div>
                       <button class="btn secondary sm" onclick="reuseBot('${i.id}')">🔄</button>
                    </div>
                 `).join('')}
              </div>
            `;
            list.appendChild(div);
        });
    }

    /* --- MODAL LOGIC --- */
    function closeModals(){ qAll('.backdrop').forEach(e => e.style.display='none'); }
    qAll('.backdrop').forEach(b => { if(b.id!=='modalSettings') b.addEventListener('click', (e)=>{if(e.target===b) closeModals()}); });

    /* Tasks Logic */
    function openTaskModal(id=null){
        editId = id;
        q('#tName').value = ''; q('#tMobile').value = ''; q('#tDesc').value = ''; q('#tDue').value = '';
        q('#btnDelTask').classList.add('hidden');
        if(id){
            const t = tasks.find(x=>x.id===id);
            const c = customers.find(x=>x.id===t.custId);
            q('#tName').value = c.name; q('#tMobile').value = c.mobile;
            q('#tDesc').value = t.desc; q('#tDue').value = t.due; q('#tStatus').value = t.status;
            q('#btnDelTask').classList.remove('hidden');
        }
        q('#modalTask').style.display = 'flex';
    }
    q('#btnSaveTask').onclick = () => {
        const name = q('#tName').value; const mob = q('#tMobile').value;
        if(!name) return toast('Name required', 'error');
        
        // Find/Create Customer
        let cid = editId ? tasks.find(x=>x.id===editId).custId : null;
        if(!cid) {
             const exist = customers.find(c=>c.name===name || (mob && c.mobile===mob));
             cid = exist ? exist.id : uuid();
             if(!exist) customers.push({id:cid, name, mobile:mob});
        }
        
        if(editId){
            const t = tasks.find(x=>x.id===editId);
            t.desc = q('#tDesc').value; t.due = q('#tDue').value; t.status = q('#tStatus').value; t.updated = nowISO();
        } else {
            tasks.push({id:uuid(), custId:cid, desc:q('#tDesc').value, due:q('#tDue').value, status:q('#tStatus').value, created:nowISO(), updated:nowISO()});
        }
        save(); closeModals(); toast('Task Saved');
    };
    q('#btnDelTask').onclick = () => { tasks = tasks.filter(t=>t.id!==editId); save(); closeModals(); };

    /* Leads Logic */
    function openLeadModal(id=null){
        editId = id;
        q('#lName').value=''; q('#lMobile').value=''; q('#lProd').value=''; q('#lNotes').value='';
        q('#btnDelLead').classList.add('hidden');
        if(id){
            const l = leads.find(x=>x.id===id);
            q('#lName').value=l.name; q('#lMobile').value=l.mobile; q('#lProd').value=l.prod; q('#lNotes').value=l.notes; q('#lStatus').value=l.status;
            q('#btnDelLead').classList.remove('hidden');
        }
        q('#modalLead').style.display='flex';
    }
    q('#btnSaveLead').onclick = () => {
        const o = { name: q('#lName').value, mobile: q('#lMobile').value, prod: q('#lProd').value, status: q('#lStatus').value, notes: q('#lNotes').value };
        if(!o.name) return toast('Name required','error');
        if(editId){
            const l = leads.find(x=>x.id===editId);
            Object.assign(l, o);
        } else {
            leads.push({id:uuid(), ...o});
        }
        save(); closeModals(); toast('Lead Saved');
    };
    q('#btnDelLead').onclick = () => { leads = leads.filter(l=>l.id!==editId); save(); closeModals(); };

    /* Bot Gen Logic */
    function openBotModal(){ q('#bDate').value=new Date().toISOString().split('T')[0]; q('#bTime').value='10:00'; q('#bMsg').value=''; q('#botOutput').classList.add('hidden'); q('#modalBot').style.display='flex'; }
    
    CT.bot = {
        smartTime: (h,m) => { q('#bTime').value = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; },
        addDays: (d) => { 
            const cur = new Date(q('#bDate').value); cur.setDate(cur.getDate()+d); 
            q('#bDate').value = cur.toISOString().split('T')[0]; 
        }
    };
    q('#btnGenBot').onclick = () => {
        const d = q('#bDate').value; const t = q('#bTime').value; const m = q('#bMsg').value;
        if(!d || !t) return toast('Date/Time required','error');
        
        // Logic for +10 mins clean command
        const [hh,mm] = t.split(':').map(Number);
        const dateObj = new Date(d); dateObj.setHours(hh,mm+10);
        const cleanStr = `remind ${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')} ${m}`;
        
        const botCmd = `!remind ${d} ${t} ${m}`;
        q('#botOutput').textContent = botCmd;
        q('#botOutput').classList.remove('hidden');
        
        // Save to History (if unique)
        if(!botHist.find(x => x.date===d && x.time===t && x.msg===m)){
            botHist.push({id:uuid(), date:d, time:t, msg:m, clean:cleanStr});
            save();
        }
    };
    window.reuseBot = (id) => {
        const i = botHist.find(x=>x.id===id);
        if(i) { q('#bDate').value=i.date; q('#bTime').value=i.time; q('#bMsg').value=i.msg; q('#modalBot').style.display='flex'; }
    };
    window.promptSmartDel = (date) => { delTargetDate = date; q('#sdDate').innerText = date; q('#modalSmartDel').style.display='flex'; };
    q('#btnJustDel').onclick = () => { botHist=botHist.filter(i=>i.date!==delTargetDate); save(); closeModals(); };
    q('#btnEmailDel').onclick = () => {
        const items = botHist.filter(i=>i.date===delTargetDate);
        const body = items.map(i => i.clean).join('\n');
        window.location.href = `mailto:?subject=Schedule ${delTargetDate}&body=${encodeURIComponent(body)}`;
        setTimeout(()=>{ botHist=botHist.filter(i=>i.date!==delTargetDate); save(); closeModals(); }, 2000);
    };

    /* --- HELPERS --- */
    function checkDue(){
        const today = new Date().setHours(0,0,0,0);
        const count = tasks.filter(t => {
            if(t.status==='Completed') return false;
            if(!t.due) return false;
            const d = new Date(t.due).setHours(0,0,0,0);
            return (d - today) < (3*86400000); // 3 days
        }).length;
        q('#dueBadge').classList.toggle('show', count>0);
    }
    q('#btnDueSoon').onclick = () => {
        const l = q('#dueList'); l.innerHTML='';
        tasks.filter(t=>t.status!=='Completed' && t.due).forEach(t=>{
             // Simple logic for popup list
             const c = customers.find(x=>x.id===t.custId);
             l.innerHTML += `<div class="row"><div class="grow"><strong>${c?.name}</strong>: ${t.desc}</div><div class="pill p-due">${t.due}</div></div>`;
        });
        q('#modalDue').style.display='flex';
    };
    window.wa = (num, name) => {
        if(!num) return toast('No Number');
        window.open(`https://wa.me/${num.replace(/\D/g,'')}?text=Hi ${name.split(' ')[0]}, `, '_blank');
    };
    window.isOverdue = (t) => { return new Date(t.due) < new Date().setHours(0,0,0,0); };
    
    // Filters Click
    qAll('.filters .chip').forEach(c => c.onclick = (e) => {
        e.target.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
        e.target.classList.add('active');
        if(e.target.dataset.filter) taskFilter = e.target.dataset.filter;
        if(e.target.dataset.lfilter) leadFilter = e.target.dataset.lfilter;
        render();
    });
    // Search listener
    q('#globalSearch').addEventListener('input', render);

    // Settings Menu
    q('#btnMenu').onclick = () => q('#modalSettings').style.display='flex';
    q('#btnTheme').onclick = () => { 
        const t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
        document.documentElement.setAttribute('data-theme', t); localStorage.setItem('ct_theme', t);
        closeModals();
    };
    q('#btnBackup').onclick = async () => {
        if(!window.JSZip) return alert('JSZip loading...');
        const zip = new JSZip();
        zip.file('backup.json', JSON.stringify({tasks,customers,leads,botHist}));
        const blob = await zip.generateAsync({type:'blob'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='crm_backup.zip'; a.click();
    };

    // Convert Lead
    window.convertLead = (lid) => {
        const l = leads.find(x=>x.id===lid);
        openTaskModal(); 
        q('#tName').value = l.name; q('#tMobile').value = l.mobile; q('#tDesc').value = `From Lead: ${l.prod}. ${l.notes||''}`;
        l.status = 'Converted'; save();
    };

    // Init
    const savedTheme = localStorage.getItem('ct_theme');
    if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    render();

  })();
  </script>
</body>
</html>
