<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Super CRM + Diary + Visits</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <style>
    :root{
      --bg:#0b1020; --panel:#121a35; --panel2:#0f1530; --text:#eaf0ff; --muted:#aab4d6;
      --border:#1f2a4f; --accent:#5b8cff; --accent2:#74d680; --warn:#ffcc66; --danger:#ff6b6b;
      --header-height:60px;
    }
    [data-theme="light"]{
      --bg:#f5f7ff; --panel:#ffffff; --panel2:#f3f6ff; --text:#0c1533; --muted:#4a5577;
      --border:#d8def0; --accent:#375dfb; --accent2:#2fbf71; --warn:#f6b84e; --danger:#ef4b4b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    
    body{
      margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; 
      background:var(--bg); color:var(--text); 
      height:100dvh; width:100vw; overflow:hidden; 
      display:flex; flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }
    
    /* --- HEADER --- */
    header{
      height:var(--header-height); flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
      background:var(--panel); border-bottom:1px solid var(--border); z-index:50;
      padding-top: env(safe-area-inset-top);
    }
    .search-bar{flex:1; position:relative}
    .search-bar input{
      width:100%; padding:10px 12px; padding-left:36px; border-radius:12px; border:1px solid var(--border); 
      background:var(--bg); color:var(--text); outline:none; font-size:16px;
    }
    .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.6}
    
    .icon-btn{
      background:transparent; border:none; color:var(--text); font-size:24px; cursor:pointer; 
      padding:8px; display:flex; align-items:center; justify-content:center;
    }

    /* --- SIDEBAR --- */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 140;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    aside.sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 80%;
      background: var(--panel); border-right: 1px solid var(--border);
      z-index: 150; transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: calc(var(--header-height) + env(safe-area-inset-top));
      display: flex; flex-direction: column;
    }
    aside.sidebar.open { transform: translateX(0); }

    .sidebar-nav { padding: 10px; overflow-y: auto; flex: 1; }
    .nav-row {
      display: flex; align-items: center; gap: 15px; width: 100%; padding: 16px;
      background: transparent; border: none; color: var(--muted); font-size: 16px; font-weight: 600;
      text-align: left; cursor: pointer; border-radius: 8px; margin-bottom: 4px;
    }
    .nav-row.active { background: rgba(91,140,255,0.1); color: var(--accent); border-left: 4px solid var(--accent); }

    /* --- MAIN --- */
    main{ flex:1; overflow-y:auto; padding:16px; padding-bottom: 100px; position: relative; z-index: 10; }
    .container{max-width:800px; margin:0 auto}

    .fab{
      position:fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right:20px;
      width:60px; height:60px; border-radius:50%; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:32px; 
      box-shadow:0 4px 15px rgba(0,0,0,.4); cursor:pointer; z-index:90; border:none;
    }

    .hidden{display:none !important}
    .card{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px}
    .inline{display:flex; gap:10px; align-items:center}
    .grow{flex:1}
    .muted{color:var(--muted); font-size:13px}
    
    .btn{padding:10px 16px; border-radius:10px; border:none; font-weight:600; cursor:pointer; font-size:14px; font-family:inherit}
    .btn.primary{background:var(--accent); color:#fff}
    .btn.secondary{background:var(--panel); border:1px solid var(--border); color:var(--text)}
    .btn.danger{background:var(--danger); color:#fff}
    .btn.sm{padding:6px 12px; font-size:12px}

    input, textarea, select{
      width:100%; padding:10px; border-radius:10px; border:1px solid var(--border);
      background:var(--bg); color:var(--text); outline:none; margin-bottom:12px; font-family:inherit;
    }
    label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:4px; display:block}

    .row{display:flex; gap:12px; padding:12px; border-bottom:1px solid var(--border); align-items:center; background:var(--panel2); border-radius:8px; margin-bottom:8px; cursor:pointer}

    .backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(3px); z-index:200;
      display:none; align-items:center; justify-content:center; padding:16px;
    }
    .modal{
      width:95%; max-width:600px; max-height:90dvh; background:var(--panel); border-radius:18px; 
      display:flex; flex-direction:column; border: 1px solid var(--border); overflow:hidden;
    }
    .modal-head{padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center}
    .modal-body{padding:16px; overflow-y:auto; flex:1}
    .modal-foot{padding:16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; background:rgba(0,0,0,0.1)}

    #toaster{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:300; width:90%; max-width:400px}
    .toast-card{background:var(--accent); color:#fff; padding:12px; border-radius:50px; text-align:center; margin-top:8px; font-weight:600; box-shadow:0 4px 10px rgba(0,0,0,0.3)}
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sbMenu">
    <div class="sidebar-nav">
      <button class="nav-row active" data-target="viewVisits"><span>📍</span> Visits</button>
      <button class="nav-row" data-target="viewTasks"><span>📝</span> Tasks</button>
      <button class="nav-row" data-target="viewLeads"><span>👥</span> Leads</button>
      <button class="nav-row" data-target="viewDiary"><span>📔</span> Diary</button>
      <button class="nav-row" data-target="viewNotes"><span>🗒️</span> Notes</button>
      <button class="nav-row" onclick="q('#modalSettings').style.display='flex'; toggleSidebar()"><span>⚙️</span> Settings</button>
    </div>
  </aside>

  <header>
    <button class="icon-btn" onclick="toggleSidebar()">☰</button>
    <div class="search-bar"><input type="text" id="globalSearch" placeholder="Search visits/names..." /></div>
  </header>

  <main>
    <div class="container">
      <div id="viewVisits">
        <div class="inline" style="justify-content:space-between; margin-bottom:15px">
          <h2 style="margin:0">Customer Visits</h2>
          <button class="btn primary sm" onclick="openVisitModal()">+ New Visit</button>
        </div>
        <div id="visitList"></div>
      </div>

      <div id="viewTasks" class="hidden"><p class="muted">Task Module Content...</p></div>
      <div id="viewLeads" class="hidden"><p class="muted">Leads Module Content...</p></div>
      <div id="viewDiary" class="hidden"><p class="muted">Diary Module Content...</p></div>
      <div id="viewNotes" class="hidden"><p class="muted">Notes Module Content...</p></div>
    </div>
  </main>

  <button id="fab" class="fab" onclick="openVisitModal()">+</button>

  <div id="modalVisit" class="backdrop">
    <div class="modal">
      <div class="modal-head"><h3>Visit Details</h3><button class="btn secondary sm" onclick="closeModals()">✕</button></div>
      <div class="modal-body">
        <label>Customer Name</label>
        <input id="vName" type="text" placeholder="Full Name">
        
        <div class="inline">
          <div class="grow"><label>Phone Number</label><input id="vPhone" type="tel" placeholder="Mobile"></div>
          <div class="grow"><label>Customer ID</label><input id="vCustId" type="text" placeholder="ID (If any)"></div>
        </div>

        <div class="inline">
          <div class="grow"><label>Date</label><input id="vDate" type="date"></div>
          <div class="grow"><label>Time</label><input id="vTime" type="time"></div>
        </div>

        <label>GPS Location (Paste from Map App)</label>
        <textarea id="vGps" placeholder="Paste link or coordinates..." style="min-height:100px"></textarea>
      </div>
      <div class="modal-foot">
        <button id="btnDelVisit" class="btn danger sm hidden">Delete</button>
        <button class="btn secondary sm" onclick="handleVisitSave(false)">Save Only</button>
        <button class="btn primary sm" onclick="handleVisitSave(true)">Save & Email</button>
      </div>
    </div>
  </div>

  <div id="modalSettings" class="backdrop">
    <div class="modal">
      <div class="modal-head"><h3>Settings</h3><button class="btn secondary sm" onclick="closeModals()">✕</button></div>
      <div class="modal-body">
        <label>Report Email Recipient</label>
        <input id="setReportEmail" type="text" placeholder="manager@office.com">
        <button class="btn primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <div id="toaster"></div>

  <script>
    const q = s => document.querySelector(s);
    const qAll = s => document.querySelectorAll(s);
    const uuid = () => Math.random().toString(36).slice(2, 9);
    
    // State
    let visits = JSON.parse(localStorage.getItem('ct_visits') || '[]');
    let currentView = 'viewVisits';
    let editId = null;
    let reportEmail = localStorage.getItem('ct_report_email') || "";

    const saveToDisk = () => {
      localStorage.setItem('ct_visits', JSON.stringify(visits));
      render();
    };

    const toast = (msg) => {
      const d = document.createElement('div'); d.className = 'toast-card';
      d.textContent = msg; q('#toaster').appendChild(d);
      setTimeout(()=>d.remove(), 2500);
    };

    window.toggleSidebar = () => {
      q('#sbMenu').classList.toggle('open');
      q('#sbOverlay').classList.toggle('open');
    };

    function closeModals() { qAll('.backdrop').forEach(b => b.style.display='none'); editId = null; }

    qAll('.nav-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        if(!target) return;
        qAll('.nav-row').forEach(r => r.classList.remove('active'));
        btn.classList.add('active');
        currentView = target;
        ['viewVisits','viewTasks','viewLeads','viewDiary','viewNotes'].forEach(id => q('#'+id).classList.add('hidden'));
        q('#' + target).classList.remove('hidden');
        toggleSidebar();
      });
    });

    // VISIT LOGIC
    function openVisitModal(id = null) {
      editId = id;
      const now = new Date();
      q('#vDate').value = now.toISOString().split('T')[0];
      q('#vTime').value = now.toTimeString().slice(0,5);
      q('#vName').value = ''; q('#vPhone').value = ''; q('#vCustId').value = ''; q('#vGps').value = '';
      q('#btnDelVisit').classList.add('hidden');

      if(id) {
        const v = visits.find(x => x.id === id);
        if(v){
          q('#vName').value = v.name; q('#vPhone').value = v.phone; q('#vCustId').value = v.custId;
          q('#vDate').value = v.date; q('#vTime').value = v.time; q('#vGps').value = v.gps;
          q('#btnDelVisit').classList.remove('hidden');
        }
      }
      q('#modalVisit').style.display = 'flex';
    }

    const handleVisitSave = (shouldEmail = false) => {
      const vName = q('#vName').value.trim();
      if(!vName) return toast("Customer Name Required");

      const entry = {
        id: editId || uuid(),
        name: vName,
        phone: q('#vPhone').value,
        custId: q('#vCustId').value,
        date: q('#vDate').value,
        time: q('#vTime').value,
        gps: q('#vGps').value
      };

      if(editId) {
        const idx = visits.findIndex(x => x.id === editId);
        visits[idx] = entry;
      } else {
        visits.push(entry);
      }

      saveToDisk();
      closeModals();
      
      if(shouldEmail) sendVisitEmail(entry);
      else toast("Visit Saved");
    };

    function sendVisitEmail(v) {
      const subject = `Visit Report: ${v.name} - ${v.date}`;
      const body = `CUSTOMER VISIT DETAILS\n` +
                   `----------------------\n` +
                   `Name: ${v.name}\n` +
                   `Phone: ${v.phone}\n` +
                   `Cust ID: ${v.custId || 'N/A'}\n` +
                   `Time: ${v.date} ${v.time}\n` +
                   `GPS: ${v.gps || 'No coordinates provided'}\n\n` +
                   `Sent from CRM App`;

      window.location.href = `mailto:${reportEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function render() {
      const term = q('#globalSearch').value.toLowerCase();
      const list = q('#visitList');
      list.innerHTML = '';
      
      const filtered = visits.filter(v => v.name.toLowerCase().includes(term) || v.phone.includes(term));

      filtered.sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time)).forEach(v => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
          <div class="grow" onclick="openVisitModal('${v.id}')">
            <strong>${v.name}</strong> <span class="muted" style="margin-left:5px">${v.phone}</span>
            <div class="muted" style="font-size:11px; margin-top:3px">${v.date} | ${v.time} | ID: ${v.custId || '--'}</div>
          </div>
          <button class="icon-btn" onclick="sendVisitEmailByID('${v.id}')" style="font-size:18px">📧</button>
        `;
        list.appendChild(div);
      });
    }

    window.sendVisitEmailByID = (id) => {
      const v = visits.find(x => x.id === id);
      if(v) sendVisitEmail(v);
    };

    q('#btnDelVisit').onclick = () => {
      if(confirm("Delete this visit?")){
        visits = visits.filter(x => x.id !== editId);
        saveToDisk(); closeModals();
      }
    };

    function saveSettings() {
      reportEmail = q('#setReportEmail').value;
      localStorage.setItem('ct_report_email', reportEmail);
      closeModals();
      toast("Settings Saved");
    }

    q('#globalSearch').oninput = render;

    // Load initial settings
    q('#setReportEmail').value = reportEmail;
    render();
  </script>
</body>
</html>
